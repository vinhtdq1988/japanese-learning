# Hạ tầng dev/triển khai cho ứng dụng học tiếng Nhật.
# Dev: `docker compose up -d db mailpit`, chạy backend bằng `pnpm dev` ở máy chủ.
# Đầy đủ: `docker compose --profile app up -d --build` (thêm `api` và `web`: nginx + TLS). Cần đặt
# JWT_SECRET và chứng chỉ TLS trong ./certs (xem backend/README.md, mục "Triển khai").

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: japanese
      POSTGRES_PASSWORD: japanese
      POSTGRES_DB: japanese_learning
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japanese -d japanese_learning"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Hộp thư thử nghiệm – CHỈ dùng cho dev (nhận email đặt lại mật khẩu), giao diện tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Giao diện web

  api:
    profiles: ["app"]
    build:
      # Ngữ cảnh là thư mục gốc vì image cần cả content/ (nội dung gốc cho lệnh seed).
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://japanese:japanese@db:5432/japanese_learning
      # PHẢI đặt JWT_SECRET ngẫu nhiên (≥ 32 ký tự) qua kho bí mật/biến môi trường; không có giá trị mặc định.
      JWT_SECRET: ${JWT_SECRET:?Hãy đặt JWT_SECRET (chuỗi ngẫu nhiên dài ≥ 32 ký tự)}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    # Không công bố cổng ra máy chủ: chỉ `web` (nginx) truy cập API qua mạng nội bộ của compose.
    expose:
      - "3000"

  web:
    profiles: ["app"]
    build:
      context: ./client
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # fullchain.pem và privkey.pem; xem backend/README.md để tạo chứng chỉ tự ký cho thử nghiệm.
      - ./certs:/etc/nginx/certs:ro

volumes:
  db_data:
