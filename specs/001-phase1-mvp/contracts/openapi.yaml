openapi: 3.0.3
info:
  title: Japanese Learning API
  version: 1.13.0
  description: |
    Hợp đồng REST API cho Giai đoạn 1 – MVP (nhánh `001-phase1-mvp`).
    - Tiền tố: `/api/v1`. Xác thực: `Authorization: Bearer <accessToken>` trừ các endpoint đánh dấu công khai.
    - Mọi bản ghi do client tạo mang `clientEventId` (UUID) để đảm bảo idempotent (FR-041).
    - Thay đổi phá vỡ tương thích PHẢI tăng phiên bản chính và được ghi trong tài liệu (Hiến pháp).
    - Nhật ký thay đổi: 1.1.0 (2026-11-04, trước khi hiện thực, chưa có client nào dùng 1.0.0) – thêm `PUT /admin/placement-questions/{questionId}` và `PUT /admin/placement-questions/active-set`; `isActive` của câu placement thành chỉ đọc; thêm `isRetry` khi ghi câu trả lời; thêm `scopeNotice` và `reason` cho lộ trình, `scopeNotice` cho tiến độ, `tier` cho đơn vị admin, `currentLevel` trong `ProfileUpdate`; `targetLevel` nhận N5–N1; bỏ trạng thái `skipped` của đơn vị trong lộ trình; `/auth/refresh` trả 403 `ACCOUNT_DISABLED`.
      1.2.0 (2026-11-04, trước khi hiện thực, chưa có client nào dùng) – `PUT /path/units/{unitId}/master` trả 200 `MasterResult` thay cho 204; `PlanItem.estMinutes` giới hạn 1–15 (gói ôn chia theo R7).
      1.3.0 (2026-11-04, trước khi hiện thực, chưa có client nào dùng) – mục và bài tập trong `AdminUnitWrite` có `id` (tùy chọn) và `status`; mục/bài tập vắng mặt trong payload sửa bị chuyển `inactive` thay vì xóa cứng; `POST /path/rebuild` với `usePlacementResultId` lưu `reason='placement_retake'`; `ProfileUpdate.currentPassword` bắt buộc khi đổi `email`, 409 trả `EMAIL_TAKEN`/`EMAIL_PENDING_DELETION`; `PUT /me/password` thu hồi các phiên khác. Thay đổi bổ sung, không phá vỡ tương thích.
      1.3.1 (2026-11-04) – sửa lỗi cú pháp, không đổi ngữ nghĩa: đặt các `description` chứa dấu phẩy trong dấu nháy (YAML tách sai thành thuộc tính thừa); thêm `type` cho các trường `nullable` dùng `allOf` theo OpenAPI 3.0.3.
      1.4.0 (2026-11-04, trước khi hiện thực, chưa có client nào dùng) – thêm `operationId` (camelCase, duy nhất) cho mọi operation; đây là tên hàm của API client sinh ra (T030), nên đổi `operationId` về sau phải ghi vào nhật ký như một thay đổi hợp đồng. Không đổi đường dẫn, request hay response.
      1.5.0 (2026-11-04, trong lúc hiện thực US1, chưa có client nào phụ thuộc) – `GET /today` khai báo thêm 404 (chưa hoàn tất onboarding nên chưa có lộ trình), khớp `GET /path`. Thay đổi bổ sung, không phá vỡ tương thích; API client sinh ra không đổi.
      1.6.0 (2026-11-04, trong lúc hiện thực US2, chưa có client nào phụ thuộc) – (1) `LessonSession` thêm `kind` và `title` (client cần tiêu đề phiên và biết phiên "học thêm"); (2) học thêm: `POST /today/extra` trả `PlanItem` có `id` là id đơn vị, client bắt đầu bằng `POST /sessions` với `planItemId` = id đó (phiên `kind='extra'`, không gắn mục kế hoạch), khai báo thêm 409 `PATH_PAUSED` và 404 mang mã `CONTENT_EXHAUSTED` kèm gợi ý `fields.suggestion` ∈ {raise_level, add_skill, content_exhausted}; (3) payload bài tập `matching` cho người học là `left[]` và `right[]` (vế phải đã xáo) thay cho `pairs[]`; (4) khai báo các mã lỗi 404/409/422 còn thiếu của `/sessions/*` (409 `SESSION_COMPLETED` khi ghi câu trả lời vào phiên đã hoàn thành) và 422 của `PUT /onboarding` (đã có từ US1 nhưng chưa khai báo). Thay đổi bổ sung và làm rõ, không phá vỡ tương thích; cần sinh lại API client vì `LessonSession` thêm trường.
      1.7.0 (2026-11-04, trong lúc hiện thực US4/US5, chưa có client nào phụ thuộc) – khai báo các mã lỗi còn thiếu của `POST /path/rebuild` (404 chưa onboarding, 422), `POST /path/pause`, `POST /path/resume` (404 chưa onboarding) và `PUT /path/units/{unitId}/master` (404 không tìm thấy đơn vị, 422 thân yêu cầu sai); làm rõ `MasterResult.remainingUnits` là số đơn vị còn có thể học (chưa học hoặc đang học dở, chưa thành thạo) và `suggestion` chỉ có mặt khi `remainingUnits = 0`; làm rõ `PATCH /me` khi chưa hoàn tất onboarding (422 cho các trường lộ trình). Thay đổi bổ sung và làm rõ, không phá vỡ tương thích; API client sinh ra không đổi.
      1.8.0 (2026-11-04, trong lúc hiện thực US8, chưa có client nào phụ thuộc) – (1) `POST /trial/events` làm rõ 422 khi tên sự kiện ngoài danh sách hoặc thân có trường ngoài `event`; (2) `TrialContent` mô tả cụ thể `answerKey` theo loại bài tập (`correctIndex` | `pairs` | `acceptedAnswers`) để client chấm cục bộ; (3) `GET /trial/content` và `POST /trial/placement/grade` làm rõ chỉ tăng bộ đếm ẩn danh; (4) sửa lỗi cú pháp YAML của `MasterResult.remainingUnits.description` (đặt trong dấu nháy; trình sinh mã từ chối spec) – không đổi ngữ nghĩa. Thay đổi bổ sung và làm rõ, không phá vỡ tương thích; cần sinh lại API client vì `answerKey` có thuộc tính.
      1.9.0 (2026-11-05, trong lúc hiện thực US6, chưa có client nào phụ thuộc) – bổ sung cho `/admin/*`: (0) thêm `GET /admin/topics` (`adminListTopics`, schema `AdminTopic`) để admin chọn `topicId` khi soạn đơn vị và câu hỏi; (1) bài tập trong `AdminUnitWrite` thêm `itemIndex` (chỉ số 0 của mục trong `items` cùng payload mà bài tập kiểm tra; cần để bài tập do admin tạo vào được lịch ôn tập, `exercises.item_id`); (2) `AdminPlacementQuestion` thêm `hint` (gợi ý song ngữ, tùy chọn) và khai báo trường bắt buộc khi ghi; (3) `AdminUserPage.items[]` thêm `role`; (4) `AdminActionLog` thêm `diff` (đã loại thông tin nhạy cảm) và `targetId` có thể null (thao tác trên cả bộ câu hỏi); (5) `GET /admin/action-logs` trả con trỏ trang kế tiếp ở header `X-Next-Cursor`; `GET /admin/units` không kèm `items`/`exercises` (xem chi tiết bằng `GET /admin/units/{unitId}`); (6) khai báo các mã 404/422 còn thiếu của `/admin/*`. Thay đổi bổ sung và làm rõ, không phá vỡ tương thích; API client sinh ra không bị ảnh hưởng vì các trường mới đều tùy chọn.
      1.10.0 (2026-11-05, trong lúc hiện thực US7, chưa có client nào phụ thuộc) – làm rõ và khai báo đủ mã lỗi cho tài khoản: (1) `PUT /me/password` thêm 422 (mật khẩu mới không hợp lệ hoặc trùng email); (2) `POST /account/delete` thêm 401 (mật khẩu sai) và 422 (thiếu mật khẩu), `permanentDeletionAt` bắt buộc; phản hồi 200 yêu cầu client xóa token ngay vì mọi phiên của tài khoản đã bị thu hồi; (3) `POST /account/restore` thêm 401 và mã lỗi `ACCOUNT_DELETED` cho 410; sau khi khôi phục client PHẢI gọi `POST /auth/refresh` vì access token hiện tại còn mang trạng thái `pending_deletion`; (4) `PATCH /me` thêm 401 `UNAUTHORIZED` cho thiếu/sai `currentPassword` khi đổi email (đã khai báo từ 1.3.0). Thay đổi bổ sung và làm rõ, không phá vỡ tương thích.
      1.11.0 (2026-11-05, spec 003-kanji-lessons) – bổ sung Kanji: (1) `Skill` thêm `kanji` (placement và dùng thử vẫn chỉ vocabulary/grammar); (2) `ProfileUpdate` thêm `skills` – đổi kỹ năng không sinh lộ trình mới, có hiệu lực ở kế hoạch kế tiếp; bỏ kỹ năng đang ưu tiên thì `prioritizedSkill` về null; (3) thêm `PUT /path/items/{itemId}/master` (chỉ mục Kanji); (4) `ContentItem` thêm `kanji`, `topicId`, `examples[].kanjiReading`; `Exercise` thêm `facet`; (5) `DailyPlan` thêm `kanjiNotice`; `PlanItem` thêm `kind`; (6) `SessionSummary` thêm `attentionItems`; (7) `ProgressSummary` thêm `kanji` và `weakTopics[].skill`; (8) `AdminUnitWrite` nhận `kind=kanji`, mục thêm `topicId`/`kanjiDetails`, bài tập thêm `facet`; `GET /admin/units` lọc `kind=kanji`, `GET /admin/topics` thêm tham số lọc `skill`. Thay đổi bổ sung; client sinh mã cũ có thể không giải mã được `Skill=kanji` nên client và backend PHẢI phát hành cùng lúc.
      1.12.0 (2026-11-07, spec 004-org-classes) – bổ sung tổ chức, lớp học, lộ trình lớp (B2B theo seat): (1) nhóm `/admin/organizations*` cho quản trị viên hệ thống (tổ chức, giấy phép, seat; KHÔNG có dữ liệu học); (2) nhóm `/org*` cho chủ tổ chức; (3) nhóm `/classes*` cho giáo viên phụ trách và chủ tổ chức (lớp, thành viên, lời mời, mã tham gia, nhập CSV, lộ trình lớp, bài giao, ghi đè cá nhân, tạm dừng, bảng điều khiển, điểm yếu, xuất CSV, yêu cầu kiểm tra trình độ); (4) `/invitations/{token}*`, `/me/class*` cho người học (xem trước + hai lựa chọn, nhập mã, "Lớp của tôi", chuyển sang lộ trình cá nhân); (5) `Me` thêm `learningSource`, `classSummary`, `organization`; `GET /path` thêm `source`; (6) `PlacementAnswers` thêm `classRequestId`; (7) mã lỗi mới `CLASS_MANAGED` (409) và các mã seat/lớp (`SEAT_UNAVAILABLE`, `SEAT_REASSIGN_LIMIT`, `SEAT_BELOW_USAGE`, `CLASS_NOT_READY`, `CLASS_FULL`, `CLASS_ARCHIVED`, `LAST_TEACHER`, `ALREADY_IN_CLASS`, `INVITEE_UNAVAILABLE`); (8) `GET /admin/action-logs` thêm tham số `organizationId`. Người học không thuộc lớp: mọi phản hồi cũ không đổi (chỉ thêm trường tùy chọn `learningSource: personal`). Vai trò tổ chức KHÔNG nằm trong access token; quyền được tra CSDL mỗi yêu cầu nên mất quyền có hiệu lực ngay. `DELETE /invitations/{token}` nhận id lời mời (uuid) ở cùng vị trí đường dẫn. Thay đổi bổ sung, không phá vỡ tương thích; client và backend PHẢI phát hành cùng lúc để hiển thị khóa lớp.
      1.13.0 (2026-11-08, spec 005-reward-feedback-effects) – bổ sung hiệu ứng thưởng: (1) `SessionSummary.celebrations` (tùy chọn) trả MỘT LẦN, trong phản hồi của lần `POST /sessions/{id}/complete` thực sự hoàn thành phiên: lời chúc mừng hoàn thành ngày (`dayCompleted`) và danh sách thành tựu vừa đạt (`achievements`, đã bản địa hóa theo ngôn ngữ hồ sơ); gọi lại trên phiên đã hoàn thành KHÔNG trả trường này và không ghi thêm gì; (2) `Profile` và `ProfileUpdate` thêm `soundEnabled`, `visualEffectsEnabled` (mặc định true; KHÔNG thuộc nhóm trường bị khóa khi người học thuộc lớp). Thành tựu không có endpoint đọc lại và không xuất hiện trong các DTO của giáo viên/tổ chức. Thay đổi bổ sung; client 1.12.0 bỏ qua các trường mới.
servers:
  - url: /api/v1
tags:
  - { name: auth, description: 'Đăng ký, đăng nhập, đặt lại mật khẩu' }
  - { name: account, description: 'Hồ sơ, xóa/khôi phục tài khoản' }
  - { name: trial, description: 'Dùng thử không đăng ký (công khai, giới hạn tần suất)' }
  - { name: onboarding, description: Onboarding và đánh giá trình độ }
  - { name: path, description: Lộ trình và điều chỉnh }
  - { name: daily, description: Kế hoạch hằng ngày và phiên học }
  - { name: progress, description: Tiến độ }
  - { name: admin, description: Quản trị (vai trò admin) }
  - { name: org, description: 'Chủ tổ chức: seat, giáo viên, lời mời' }
  - { name: classes, description: 'Lớp học, lộ trình lớp, theo dõi lớp (giáo viên phụ trách, chủ tổ chức)' }
  - { name: classroom, description: 'Học viên: lời mời, mã tham gia, Lớp của tôi' }

paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Đăng ký (FR-001) – không yêu cầu xác minh email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Đã tạo tài khoản và đăng nhập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '409':
          description: Email đã dùng, hoặc email đang chờ xóa (`EMAIL_PENDING_DELETION`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Thành công. `accountStatus=pending_deletion` nghĩa là chỉ được khôi phục tài khoản.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthTokens'
                  - type: object
                    properties:
                      accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Tài khoản bị vô hiệu hóa bởi quản trị viên (`ACCOUNT_DISABLED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Làm mới access token (xoay vòng refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Tài khoản bị vô hiệu hóa bởi quản trị viên (`ACCOUNT_DISABLED`); refresh token đã bị thu hồi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Đăng xuất (thu hồi phiên hiện tại)
      responses:
        '204': { description: Đã đăng xuất }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Yêu cầu liên kết đặt lại mật khẩu (FR-001)
      description: Luôn trả 202 dù email có tồn tại hay không (chống dò tài khoản).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 'Nếu email tồn tại, liên kết đã được gửi (hết hạn sau 1 giờ)' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Đặt mật khẩu mới bằng token một lần
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: Đã đổi mật khẩu; mọi phiên cũ bị thu hồi }
        '400':
          description: Token hết hạn hoặc đã dùng (`RESET_TOKEN_INVALID`) – gợi ý yêu cầu liên kết mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Thông tin tài khoản + hồ sơ học tập
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMe
      tags: [account]
      summary: Sửa hồ sơ (FR-002)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Hồ sơ đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { description: '`currentPassword` thiếu hoặc sai khi đổi email', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Email đã được dùng (`EMAIL_TAKEN`) hoặc thuộc tài khoản đang chờ xóa (`EMAIL_PENDING_DELETION`); hoặc học viên thuộc lớp đổi trường do lớp quyết định (`CLASS_MANAGED`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'Dữ liệu không hợp lệ (thông báo cụ thể theo trường), gồm: các trường lộ trình (`currentLevel`, `goalType`, `targetLevel`, `targetDate`, `prioritizedSkill`) khi chưa hoàn tất onboarding; `targetLevel` bắt buộc khi `goalType=jlpt`; `targetDate` trước hôm nay; `prioritizedSkill` ngoài các kỹ năng đã chọn', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /me/password:
    put:
      operationId: changePassword
      tags: [account]
      summary: Đổi mật khẩu
      description: Yêu cầu `currentPassword` đúng. Đổi thành công thu hồi mọi `auth_sessions` khác của người dùng, chỉ giữ phiên hiện tại.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: Đã đổi }
        '401': { description: '`currentPassword` thiếu hoặc sai, hoặc token không hợp lệ', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/delete:
    post:
      operationId: deleteAccount
      tags: [account]
      summary: Xóa tài khoản – vô hiệu hóa ngay, xóa vĩnh viễn sau 30 ngày (FR-003)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Tài khoản chuyển sang `pending_deletion`; mọi phiên (kể cả phiên hiện tại) bị thu hồi nên client PHẢI xóa token cục bộ ngay
          content:
            application/json:
              schema:
                type: object
                required: [permanentDeletionAt]
                properties:
                  permanentDeletionAt: { type: string, format: date-time }
        '401': { description: 'Mật khẩu sai hoặc token không hợp lệ', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/restore:
    post:
      operationId: restoreAccount
      tags: [account]
      summary: Khôi phục tài khoản trong 30 ngày chờ xóa
      description: Gọi bằng token cấp khi đăng nhập tài khoản `pending_deletion` (`accountStatus` của đăng nhập). Token đó mang trạng thái `pending_deletion` nên sau khi khôi phục client PHẢI gọi `POST /auth/refresh` để lấy access token `active`.
      responses:
        '200':
          description: Đã khôi phục cùng toàn bộ dữ liệu học tập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { description: 'Quá 30 ngày, dữ liệu đã bị xóa (`ACCOUNT_DELETED`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /trial/content:
    get:
      operationId: getTrialContent
      tags: [trial]
      summary: Nội dung dùng thử cố định (công khai) – FR-036/037
      description: |
        Trả tập đơn vị học đánh dấu `is_trial`. Bài tập trong payload có kèm đáp án để client chấm cục bộ
        (nội dung công khai). Không tạo bản ghi định danh nào trên máy chủ; chỉ tăng bộ đếm tổng hợp ẩn danh theo ngày (FR-038). Giới hạn tần suất (FR-040).
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialContent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /placement/questions:
    get:
      operationId: listPlacementQuestions
      tags: [trial, onboarding]
      summary: Bộ câu hỏi kiểm tra trình độ (công khai, KHÔNG kèm đáp án)
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Bộ 20 câu (8 N5, 6 N4, 6 N3), tối đa 10 phút
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementQuestionSet' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /trial/placement/grade:
    post:
      operationId: gradeTrialPlacement
      tags: [trial]
      summary: Chấm bài kiểm tra trình độ cho khách – không lưu gì
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementAnswers' }
      responses:
        '200':
          description: Kết quả ước tính
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /trial/events:
    post:
      operationId: recordTrialEvent
      tags: [trial]
      summary: Ghi nhận sự kiện dùng thử ẩn danh (chỉ tăng bộ đếm tổng hợp theo ngày, FR-038)
      description: |
        Không nhận và không lưu bất kỳ dữ liệu nào khác ngoài tên sự kiện; không gắn với IP hay trình duyệt.
        Giới hạn tần suất (FR-040).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              additionalProperties: false
              properties:
                event: { type: string, enum: [lesson_completed] }
      responses:
        '204': { description: Đã ghi nhận }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /onboarding:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      summary: Trạng thái và bản nháp onboarding (tiếp tục khi bỏ dở)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingState' }
    put:
      operationId: saveOnboarding
      tags: [onboarding]
      summary: Lưu nháp các bước đã nhập (FR-005)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingDraft' }
      responses:
        '409': { description: 'Học viên thuộc lớp: thao tác do lớp quyết định (`CLASS_MANAGED`, `fields` liệt kê trường bị khóa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingState' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Hoàn tất onboarding – sinh lộ trình và bài học hôm nay (FR-008, FR-010)
      description: Có thể không kèm kết quả kiểm tra (bỏ qua) – lộ trình sinh từ hồ sơ khai báo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingDraft' }
      responses:
        '409': { description: 'Học viên thuộc lớp: thao tác do lớp quyết định (`CLASS_MANAGED`, `fields` liệt kê trường bị khóa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200':
          description: Lộ trình và kế hoạch hôm nay
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { $ref: '#/components/schemas/PathSummary' }
                  today: { $ref: '#/components/schemas/DailyPlan' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /placement/submit:
    post:
      operationId: submitPlacement
      tags: [onboarding]
      summary: Nộp bài kiểm tra trình độ (cũng dùng để mang kết quả dùng thử sang – FR-039; làm lại – FR-009)
      description: Server chấm lại từ các câu trả lời và lưu `placement_results`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementAnswers' }
      responses:
        '409': { description: 'Học viên thuộc lớp: thao tác do lớp quyết định (`CLASS_MANAGED`, `fields` liệt kê trường bị khóa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200':
          description: Kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementResult' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /path:
    get:
      operationId: getPath
      tags: [path]
      summary: Lộ trình hiện tại
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PathDetail' } } } }
        '404': { description: Chưa có lộ trình (chưa onboarding), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /path/rebuild:
    post:
      operationId: rebuildPath
      tags: [path]
      summary: Xây dựng lại lộ trình (FR-016) – giữ lịch sử và lịch ôn
      description: 'Có `usePlacementResultId` (làm lại placement rồi chọn xây dựng lại, US1.6) → lộ trình mới lưu `reason=''placement_retake''`; bỏ trống → `reason=''rebuild_request''`.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                usePlacementResultId:
                  type: string
                  format: uuid
                  description: Dùng kết quả kiểm tra mới; bỏ trống = theo hồ sơ hiện tại
      responses:
        '409': { description: 'Học viên thuộc lớp: thao tác do lớp quyết định (`CLASS_MANAGED`, `fields` liệt kê trường bị khóa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Lộ trình mới, content: { application/json: { schema: { $ref: '#/components/schemas/PathSummary' } } } }
        '404': { description: 'Chưa hoàn tất onboarding, hoặc không tìm thấy kết quả kiểm tra `usePlacementResultId`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /path/pause:
    post:
      operationId: pausePath
      tags: [path]
      summary: Tạm dừng lộ trình
      description: Mở giai đoạn tạm dừng; khi đang tạm dừng không sinh kế hoạch ngày và không có ngày bỏ lỡ. Gọi lại khi đang tạm dừng không làm gì.
      responses:
        '409': { description: 'Học viên thuộc lớp: thao tác do lớp quyết định (`CLASS_MANAGED`, `fields` liệt kê trường bị khóa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '204': { description: Đã tạm dừng }
        '404': { description: Chưa hoàn tất onboarding, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /path/resume:
    post:
      operationId: resumePath
      tags: [path]
      summary: Tiếp tục lộ trình
      description: Đóng giai đoạn tạm dừng; các ngày tạm dừng không tính vào khoảng nghỉ hay chuỗi ngày học. Gọi lại khi không tạm dừng không làm gì.
      responses:
        '409': { description: 'Học viên thuộc lớp: thao tác do lớp quyết định (`CLASS_MANAGED`, `fields` liệt kê trường bị khóa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '204': { description: Đã tiếp tục }
        '404': { description: Chưa hoàn tất onboarding, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /path/units/{unitId}/master:
    put:
      operationId: setUnitMastered
      tags: [path]
      summary: Đánh dấu / bỏ đánh dấu đã thành thạo
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mastered]
              properties:
                mastered: { type: boolean }
      responses:
        '409': { description: 'Học viên thuộc lớp: thao tác do lớp quyết định (`CLASS_MANAGED`, `fields` liệt kê trường bị khóa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/MasterResult' } } } }
        '404': { description: 'Chưa hoàn tất onboarding, hoặc không tìm thấy đơn vị học đang hoạt động', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /path/items/{itemId}/master:
    put:
      operationId: setItemMastered
      tags: [path]
      summary: Đánh dấu / bỏ đánh dấu một chữ Kanji đã thành thạo (dừng / tiếp tục ôn mọi khía cạnh)
      description: Idempotent – gửi lại cùng giá trị trả 200 không đổi dữ liệu. Đánh dấu cả bài Kanji dùng `PUT /path/units/{unitId}/master`.
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mastered]
              properties:
                mastered: { type: boolean }
      responses:
        '409': { description: 'Học viên thuộc lớp: thao tác do lớp quyết định (`CLASS_MANAGED`, `fields` liệt kê trường bị khóa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                type: object
                required: [itemId, mastered]
                properties:
                  itemId: { type: string, format: uuid }
                  mastered: { type: boolean }
        '404': { description: 'Chưa hoàn tất onboarding, hoặc người học chưa học chữ này (không có lịch ôn)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'Mục không phải Kanji, hoặc thân yêu cầu sai', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /today:
    get:
      operationId: getToday
      tags: [daily]
      summary: Kế hoạch hôm nay (sinh một lần theo ngày địa phương)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DailyPlan' } } } }
        '404': { description: Chưa có lộ trình (chưa hoàn tất onboarding), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Lộ trình đang tạm dừng (`PATH_PAUSED`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /today/extra:
    post:
      operationId: getExtraUnit
      tags: [daily]
      summary: Học thêm sau khi xong kế hoạch (US2.5) – không đổi kế hoạch mặc định
      description: '`PlanItem.id` trả về là id của đơn vị học; client bắt đầu học bằng `POST /sessions` với `planItemId` bằng giá trị đó (phiên `kind=extra`).'
      responses:
        '200': { description: Đơn vị bổ sung, content: { application/json: { schema: { $ref: '#/components/schemas/PlanItem' } } } }
        '404': { description: 'Hết nội dung phù hợp (`CONTENT_EXHAUSTED`), kèm gợi ý trong `fields.suggestion` ∈ {raise_level, add_skill, content_exhausted}; hoặc chưa hoàn tất onboarding (`NOT_FOUND`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Lộ trình đang tạm dừng (`PATH_PAUSED`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /sessions:
    post:
      operationId: startSession
      tags: [daily]
      summary: Bắt đầu hoặc tiếp tục một phiên học cho mục kế hoạch
      description: '`planItemId` là id mục kế hoạch của người học, hoặc id đơn vị do `POST /today/extra` trả về (học thêm). Đã có phiên cho mục đó thì trả lại phiên ấy (tiếp tục, đúng snapshot cũ).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planItemId]
              properties:
                planItemId: { type: string, format: uuid }
      responses:
        '200': { description: Phiên (ảnh chụp bài tập + câu đã trả lời), content: { application/json: { schema: { $ref: '#/components/schemas/LessonSession' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Lộ trình đang tạm dừng (`PATH_PAUSED`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sessions/{sessionId}/answers:
    post:
      operationId: submitAnswer
      tags: [daily]
      summary: Ghi câu trả lời – chấm tự động, idempotent (FR-025, FR-041)
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerSubmission' }
      responses:
        '200':
          description: Kết quả chấm; trùng `clientEventId` trả lại kết quả đã có
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Phiên đã hoàn thành (`SESSION_COMPLETED`); gửi lại `clientEventId` đã ghi vẫn trả 200', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sessions/{sessionId}/intervals:
    post:
      operationId: recordStudyInterval
      tags: [daily]
      summary: Ghi khoảng thời gian học (idempotent)
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientEventId, startedAt, durationSeconds]
              properties:
                clientEventId: { type: string, format: uuid }
                startedAt: { type: string, format: date-time }
                durationSeconds: { type: integer, minimum: 1, maximum: 1800 }
      responses:
        '204': { description: Đã ghi (hoặc đã có) }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sessions/{sessionId}/complete:
    post:
      operationId: completeSession
      tags: [daily]
      summary: Hoàn thành phiên – cập nhật trạng thái mục kế hoạch/ngày và trả tóm tắt
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tóm tắt; nếu mục cuối cùng thì kế hoạch ngày `completed`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Còn câu chưa trả lời (`SESSION_INCOMPLETE`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Tóm tắt tiến độ (FR-026 → FR-029)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressSummary' } } } }

  /admin/topics:
    get:
      operationId: adminListTopics
      tags: [admin]
      summary: Danh sách mảng nội dung (để chọn `topicId` khi soạn đơn vị học và câu hỏi kiểm tra trình độ)
      parameters:
        - { name: skill, in: query, required: false, schema: { $ref: '#/components/schemas/Skill' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminTopic' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/units:
    get:
      operationId: adminListUnits
      tags: [admin]
      summary: Danh sách đơn vị học (lọc theo trạng thái, trình độ, loại); không kèm `items`/`exercises`
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, inactive] } }
        - { name: level, in: query, schema: { type: string, enum: [N5, N4, N3] } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/Skill' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminUnit' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: adminCreateUnit
      tags: [admin]
      summary: Tạo đơn vị học (kèm mục nội dung và bài tập) – FR-030
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUnitWrite' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUnit' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/units/{unitId}:
    parameters:
      - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetUnit
      tags: [admin]
      summary: Chi tiết đơn vị học (kèm mọi mục và bài tập, cả `inactive`)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUnit' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminUpdateUnit
      tags: [admin]
      summary: Sửa đơn vị học (có hiệu lực với phiên mới; phiên đang học giữ nguyên ảnh chụp). Đơn vị đang `active` PHẢI vẫn đạt kiểm tra nội dung sau khi sửa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUnitWrite' }
      responses:
        '200': { description: Đã sửa, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUnit' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/units/{unitId}/status:
    put:
      operationId: adminSetUnitStatus
      tags: [admin]
      summary: Kích hoạt / vô hiệu hóa; đánh dấu thuộc tập dùng thử (FR-037)
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [draft, active, inactive] }
                isTrial: { type: boolean }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUnit' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Không đạt kiểm tra nội dung khi kích hoạt (`fields` liệt kê từng lỗi theo vị trí), hoặc thân rỗng', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/placement-questions:
    get:
      operationId: adminListPlacementQuestions
      tags: [admin]
      summary: Danh sách câu hỏi kiểm tra trình độ
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminPlacementQuestion' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreatePlacementQuestion
      tags: [admin]
      summary: Tạo câu hỏi kiểm tra trình độ (luôn ở trạng thái chưa kích hoạt; đưa vào bộ hiện hành bằng `PUT /admin/placement-questions/active-set`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPlacementQuestion' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPlacementQuestion' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/placement-questions/{questionId}:
    put:
      operationId: adminUpdatePlacementQuestion
      tags: [admin]
      summary: Sửa câu hỏi kiểm tra trình độ (nội dung, lựa chọn, đáp án, position) – ghi nhật ký quản trị (FR-030, FR-032)
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPlacementQuestion' }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPlacementQuestion' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Dữ liệu không hợp lệ; với câu đang thuộc bộ hiện hành, không được đổi `level` (làm sai số câu theo trình độ) hay trùng `position` với câu khác của bộ (`PLACEMENT_SET_INVALID` khi đổi `level`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/placement-questions/active-set:
    put:
      operationId: adminSetActivePlacementSet
      tags: [admin]
      summary: Kích hoạt nguyên tử một bộ câu hỏi (thay thế bộ hiện hành) – PHẢI đúng 20 câu (8 N5, 6 N4, 6 N3) (FR-007, FR-030)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionIds]
              properties:
                questionIds: { type: array, minItems: 20, maxItems: 20, items: { type: string, format: uuid }, description: Thứ tự mảng = position }
      responses:
        '204': { description: Đã kích hoạt (ghi nhật ký quản trị) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'Bộ không hợp lệ (`PLACEMENT_SET_INVALID`: sai số lượng theo trình độ, câu không tồn tại); bộ hiện hành không đổi', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Tìm tài khoản người học (FR-031), mới nhất trước
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Tìm theo email/tên }
        - { name: cursor, in: query, schema: { type: string }, description: '`nextCursor` của trang trước' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{userId}/status:
    put:
      operationId: adminSetUserStatus
      tags: [admin]
      summary: Vô hiệu hóa / kích hoạt lại tài khoản
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '204': { description: Đã cập nhật (ghi vào nhật ký quản trị). Vô hiệu hóa thu hồi mọi refresh token; access token đã cấp còn hiệu lực tối đa 15 phút }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Chỉ đổi được trạng thái giữa `active` và `disabled` của tài khoản người học, không phải của chính mình hay tài khoản quản trị / đang chờ xóa', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/action-logs:
    get:
      operationId: adminListActionLogs
      tags: [admin]
      summary: Nhật ký hành động quản trị (FR-032), mới nhất trước
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: 'Giá trị header `X-Next-Cursor` của trang trước' }
        - { name: organizationId, in: query, schema: { type: string, format: uuid }, description: 'Chỉ lấy nhật ký của một tổ chức (spec 004, FR-008)' }
      responses:
        '200':
          description: OK; header `X-Next-Cursor` có mặt khi còn trang kế tiếp
          headers:
            X-Next-Cursor: { schema: { type: string } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminActionLog' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- spec 004: học viên (1.12.0)
  /invitations/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: 'GET: token trong email. DELETE: id (uuid) của lời mời cần thu hồi (cùng vị trí đường dẫn).' }
    get:
      operationId: getInvitation
      tags: [classroom]
      summary: Xem trước lời mời (kèm danh sách dữ liệu chia sẻ khi mời học viên)
      description: Người gọi PHẢI có email trùng email lời mời. Token sai/hết hạn/đã dùng/email không khớp → 404 chung (không lộ lời mời).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationPreview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokeInvitation
      tags: [org]
      summary: Thu hồi lời mời (OWN - mọi lời mời của tổ chức; TCH - lời mời học viên của lớp mình)
      responses:
        '204': { description: Đã thu hồi (trả lại chỗ giữ) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invitations/{token}/respond:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      operationId: respondInvitation
      tags: [classroom]
      summary: Trả lời lời mời (học viên - hai lựa chọn ngang nhau; giáo viên/chủ tổ chức - chấp nhận/từ chối)
      description: 'Học viên `join_class` PHẢI kèm `confirmed:true`; `stay_personal` đóng lời mời, không tốn seat, không đổi hồ sơ. Mất seat khi chấp nhận: 409 `SEAT_UNAVAILABLE`/422 `SEAT_REASSIGN_LIMIT`, lời mời giữ `pending`.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvitationRespond' } } }
      responses:
        '200': { description: Kết quả, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationRespondResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/class/join:
    post:
      operationId: joinClassByCode
      tags: [classroom]
      summary: Nhập mã tham gia lớp (hai bước không trạng thái - xem trước rồi xác nhận)
      description: 'Không `decision` → 200 xem trước `{class, disclosure}`. `decision=join_class` + `confirmed:true` → tham gia. `decision=stay_personal` → 204, không đổi gì. Sai mã/đã tắt/hết hạn/lớp lưu trữ/lớp chưa lộ trình → cùng một 404 chung; sai liên tiếp → 429 (khóa theo tài khoản).'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JoinByCode' } } }
      responses:
        '200': { description: Xem trước hoặc đã tham gia, content: { application/json: { schema: { $ref: '#/components/schemas/JoinByCodeResult' } } } }
        '204': { description: Học viên chọn ở lại lộ trình cá nhân }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/class:
    get:
      operationId: getMyClass
      tags: [classroom]
      summary: Lớp của tôi (lộ trình lớp, bài giao, tiến độ trong lớp, dữ liệu chia sẻ)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyClass' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/class/leave:
    post:
      operationId: leaveMyClass
      tags: [classroom]
      summary: Chuyển sang lộ trình cá nhân (rời lớp bất cứ lúc nào)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: boolean, enum: [true] } } } } }
      responses:
        '204': { description: 'Đã rời lớp; tổ chức mất quyền xem ngay, lịch sử học giữ nguyên' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- spec 004: quản trị viên hệ thống
  /admin/organizations:
    get:
      operationId: adminListOrganizations
      tags: [admin]
      summary: Danh sách tổ chức (không có dữ liệu học viên)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrgStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganizationPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: adminCreateOrganization
      tags: [admin]
      summary: Tạo tổ chức, mời chủ tổ chức, cấp giấy phép/seat tùy chọn
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganizationCreate' } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganizationDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/organizations/{orgId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetOrganization
      tags: [admin]
      summary: Chi tiết tổ chức - giấy phép, người giữ seat, chủ tổ chức
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganizationDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: adminUpdateOrganization
      tags: [admin]
      summary: Đổi tên hoặc vô hiệu hóa/kích hoạt lại tổ chức
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 1, maxLength: 120 }, status: { $ref: '#/components/schemas/OrgStatus' } } } } }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganizationDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/organizations/{orgId}/owners/invitations:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminInviteOwner
      tags: [admin]
      summary: Mời thêm/thay chủ tổ chức (không chiếm seat)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '201': { description: Đã gửi lời mời, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationRow' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/organizations/{orgId}/licenses:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminCreateLicense
      tags: [admin]
      summary: Cấp giấy phép (kỳ hạn + số seat)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LicenseWrite' } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/OrgLicense' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/organizations/{orgId}/licenses/{licenseId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: licenseId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: adminUpdateLicense
      tags: [admin]
      summary: Chỉnh giấy phép (số seat, hạn, ân hạn, giới hạn đổi người giữ)
      description: Giảm `seats` dưới (đang dùng + giữ chỗ) → 422 `SEAT_BELOW_USAGE`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LicenseUpdate' } } }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/OrgLicense' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/organizations/{orgId}/licenses/{licenseId}/revoke:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: licenseId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRevokeLicense
      tags: [admin]
      summary: Thu hồi giấy phép - xử lý như hết hạn
      responses:
        '204': { description: Đã thu hồi }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/organizations/{orgId}/seats/{userId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminRevokeSeat
      tags: [admin]
      summary: Thu hồi seat của một người (học viên - đóng thành viên; giáo viên - giữ vai trò, mất quyền dữ liệu)
      responses:
        '204': { description: Đã thu hồi }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- spec 004: chủ tổ chức
  /org:
    get:
      operationId: getOrg
      tags: [org]
      summary: Tổng quan tổ chức - seat, giấy phép, giáo viên, lớp, lời mời chờ
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrgOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /org/teachers/invitations:
    post:
      operationId: inviteTeacher
      tags: [org]
      summary: Mời giáo viên (giữ chỗ một seat)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '201': { description: Đã gửi lời mời, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationRow' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /org/teachers/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeTeacher
      tags: [org]
      summary: Gỡ vai trò giáo viên - mất quyền ngay, giải phóng seat
      responses:
        '204': { description: Đã gỡ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /org/seats/{userId}/grant:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: grantSeat
      tags: [org]
      summary: Cấp lại seat cho giáo viên đang mất seat
      responses:
        '204': { description: Đã cấp }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /org/seats/{userId}/revoke:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeOrgSeat
      tags: [org]
      summary: Thu hồi seat của giáo viên/học viên trong tổ chức mình
      responses:
        '204': { description: Đã thu hồi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- spec 004: lớp học
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: Danh sách lớp (giáo viên - lớp mình phụ trách; chủ tổ chức - mọi lớp)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClassRow' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createClass
      tags: [classes]
      summary: Tạo lớp (giáo viên tự là phụ trách; `teacherIds` chỉ chủ tổ chức)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 120 }, description: { type: string, nullable: true }, teacherIds: { type: array, items: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClass
      tags: [classes]
      summary: Chi tiết cấu trúc lớp (không có dữ liệu học); lớp lưu trữ vẫn xem được
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Sửa tên, mô tả, ngưỡng vắng mặt
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 1, maxLength: 120 }, description: { type: string, nullable: true }, absenceThresholdDays: { type: integer, minimum: 1, maximum: 14 } } } } }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/archive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: archiveClass
      tags: [classes]
      summary: Lưu trữ lớp (một chiều) - đóng mọi thành viên, vô hiệu mã và lời mời chờ
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: boolean, enum: [true] } } } } }
      responses:
        '200': { description: Đã lưu trữ, content: { application/json: { schema: { type: object, required: [learnersMoved], properties: { learnersMoved: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/teachers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setClassTeachers
      tags: [classes]
      summary: Đặt danh sách giáo viên phụ trách (chủ tổ chức; luôn ≥ 1)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [userIds], properties: { userIds: { type: array, items: { type: string, format: uuid } } } } } }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/roster:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClassRoster
      tags: [classes]
      summary: Danh sách học viên theo trạng thái (đã vào, chờ, từ chối, tự chuyển cá nhân, bị gỡ)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RosterRow' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /classes/{id}/members/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeClassMember
      tags: [classes]
      summary: Gỡ học viên khỏi lớp, giải phóng seat
      responses:
        '204': { description: Đã gỡ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /classes/{id}/members/{userId}/move:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: moveClassMember
      tags: [classes]
      summary: Mời học viên chuyển sang lớp khác trong cùng tổ chức (học viên PHẢI đồng ý lại; khi đồng ý giữ seat, tiến độ, lịch ôn)
      description: 'Không chuyển ngay (Hiến pháp III): tạo lời mời `student` tới lớp đích gửi cho học viên; chỉ khi học viên chấp nhận qua `POST /invitations/{token}/respond` (`join_class` + `confirmed`) mới đóng thành viên lớp cũ (`moved`) và mở thành viên lớp đích, giữ nguyên seat. Người gọi phải là chủ tổ chức hoặc giáo viên phụ trách cả hai lớp; lớp đích ngoài phạm vi ⇒ 404 chung. 409 `CLASS_FULL`/`CLASS_NOT_READY`/`CLASS_ARCHIVED`.'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [toClassId], properties: { toClassId: { type: string, format: uuid } } } } }
      responses:
        '202': { description: Đã gửi lời mời chuyển lớp (chờ học viên đồng ý) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/invitations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: inviteClassLearners
      tags: [classes]
      summary: Mời học viên bằng email (≤ 50 mỗi lần) - mỗi lời mời giữ chỗ một seat
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [invitees], properties: { invitees: { type: array, minItems: 1, maxItems: 50, items: { type: object, required: [email], properties: { email: { type: string }, displayName: { type: string } } } } } } } }
      responses:
        '200': { description: Kết quả từng email, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResults' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/invitations/import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importClassLearnersCsv
      tags: [classes]
      summary: Nhập danh sách học viên từ CSV - đúng một kết quả cho mỗi dòng dữ liệu
      description: 'Thân là nội dung file CSV (`text/csv; charset=utf-8`), ≤ `CSV_IMPORT_MAX_ROWS` dòng và `CSV_IMPORT_MAX_BYTES` byte; sai định dạng/quá cỡ → 422 toàn file. Định dạng: `contracts/csv-formats.md` của spec 004.'
      requestBody:
        required: true
        content: { text/csv: { schema: { type: string } } }
      responses:
        '200': { description: Kết quả từng dòng, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResults' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/join-code:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getJoinCode
      tags: [classes]
      summary: Xem mã tham gia (chỉ người quản lý lớp)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/JoinCode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setJoinCode
      tags: [classes]
      summary: Bật/tắt mã tham gia (bật lần đầu sinh mã), đặt hạn tùy chọn
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, expiresAt: { type: string, format: date-time, nullable: true } } } } }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/JoinCode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/join-code/rotate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rotateJoinCode
      tags: [classes]
      summary: Đổi mã tham gia (mã cũ vô hiệu ngay)
      responses:
        '200': { description: Mã mới, content: { application/json: { schema: { $ref: '#/components/schemas/JoinCode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- spec 004: lộ trình lớp
  /classes/{id}/path:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClassPath
      tags: [classes]
      summary: Lộ trình lớp (`path` là null khi chưa đặt)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [path], properties: { path: { allOf: [{ $ref: '#/components/schemas/ClassPath' }], nullable: true } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putClassPath
      tags: [classes]
      summary: Tạo/sửa lộ trình lớp theo mẫu (không có thao tác xóa)
      description: Có hiệu lực từ kế hoạch được sinh kế tiếp; tiến độ và lịch ôn giữ nguyên. Lưu trọn vẹn hoặc không đổi; cảnh báo khả thi không chặn lưu.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClassPathTemplate' } } }
      responses:
        '200': { description: Đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/ClassPath' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/path/units:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putClassPathUnits
      tags: [classes]
      summary: Chọn bài, thứ tự và ngày mở (`units` rỗng quay lại chế độ mẫu)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [units], properties: { units: { type: array, items: { type: object, required: [unitId], properties: { unitId: { type: string, format: uuid }, opensOn: { type: string, format: date, nullable: true } } } } } } } }
      responses:
        '200': { description: Đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/ClassPath' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/assignments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createClassAssignments
      tags: [classes]
      summary: Giao bài (1-20 đơn vị, một hạn)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [unitIds, dueOn], properties: { unitIds: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid } }, dueOn: { type: string, format: date } } } } }
      responses:
        '201': { description: Đã giao, content: { application/json: { schema: { type: object, required: [batchId, assignments], properties: { batchId: { type: string, format: uuid }, assignments: { type: array, items: { $ref: '#/components/schemas/ClassAssignment' } }, warnings: { type: array, items: { $ref: '#/components/schemas/PathWarning' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/assignments/{assignmentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: cancelClassAssignment
      tags: [classes]
      summary: Hủy bài giao
      responses:
        '204': { description: Đã hủy }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /classes/{id}/members/{userId}/override:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putLearnerOverride
      tags: [classes]
      summary: Ghi đè riêng một học viên (phút mỗi ngày, dời mốc)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [shiftDays], properties: { dailyMinutes: { type: integer, enum: [5, 10, 15, 30], nullable: true }, shiftDays: { type: integer, minimum: -60, maximum: 60 } } } } }
      responses:
        '200': { description: Đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/LearnerOverride' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/members/{userId}/exemptions/{unitId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: exemptLearnerUnit
      tags: [classes]
      summary: Miễn một đơn vị cho học viên
      responses:
        '204': { description: Đã miễn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: unexemptLearnerUnit
      tags: [classes]
      summary: Bỏ miễn đơn vị cho học viên
      responses:
        '204': { description: Đã bỏ miễn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /classes/{id}/pauses:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listClassPauses
      tags: [classes]
      summary: Các khoảng tạm dừng (cả lớp và từng học viên)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClassPause' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createClassPause
      tags: [classes]
      summary: Tạm dừng cả lớp (vắng `userId`) hoặc một học viên
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [startedOn], properties: { userId: { type: string, format: uuid }, startedOn: { type: string, format: date }, endedOn: { type: string, format: date, nullable: true } } } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/ClassPause' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/pauses/{pauseId}/end:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: pauseId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: endClassPause
      tags: [classes]
      summary: Kết thúc khoảng tạm dừng (mặc định hôm nay)
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { endedOn: { type: string, format: date } } } } }
      responses:
        '200': { description: Đã kết thúc, content: { application/json: { schema: { $ref: '#/components/schemas/ClassPause' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- spec 004: theo dõi lớp
  /classes/{id}/dashboard:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClassDashboard
      tags: [classes]
