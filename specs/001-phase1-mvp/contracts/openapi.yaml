        - { name: sort, in: query, schema: { type: string, enum: [name, completion, streak, minutes7, accuracy, lastActive, status] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: filter, in: query, schema: { type: string, enum: [behind, absent, needs_attention, paused, not_started] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDashboard' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}/members/{userId}/detail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClassLearnerDetail
      tags: [classes]
      summary: Chi tiết một học viên - KHÔNG có từng câu trả lời
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClassLearnerDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /classes/{id}/weak-topics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClassWeakTopics
      tags: [classes]
      summary: Điểm yếu chung của lớp (mức yếu giảm dần)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClassWeakTopic' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /classes/{id}/export.csv:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportClassCsv
      tags: [classes]
      summary: Xuất báo cáo lớp (CSV có BOM, chống công thức; ghi nhật ký `class.export`)
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /classes/{id}/members/{userId}/export.csv:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportClassLearnerCsv
      tags: [classes]
      summary: Xuất CSV chi tiết một học viên
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /classes/{id}/placement-requests:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createClassPlacementRequest
      tags: [classes]
      summary: Yêu cầu cả lớp làm bài kiểm tra trình độ
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/ClassPlacementRequest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /classes/{id}/placement-requests/current:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClassPlacementRequest
      tags: [classes]
      summary: Kết quả kiểm tra trình độ của lớp (không tự đổi lộ trình lớp)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClassPlacementResults' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /classes/{id}/placement-requests/current/close:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: closeClassPlacementRequest
      tags: [classes]
      summary: Đóng yêu cầu kiểm tra trình độ
      responses:
        '204': { description: Đã đóng }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Lang:
      name: lang
      in: query
      schema: { type: string, enum: [vi, en], default: vi }
  responses:
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Không có quyền quản trị (FR-004)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Không tìm thấy tài nguyên
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Dữ liệu không hợp lệ (thông báo cụ thể theo trường)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: 'Xung đột trạng thái nghiệp vụ; `code` cho biết lý do (CLASS_MANAGED, SEAT_UNAVAILABLE, CLASS_NOT_READY, CLASS_FULL, CLASS_ARCHIVED, LAST_TEACHER, ALREADY_IN_CLASS, INVITEE_UNAVAILABLE, ...)'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Vượt giới hạn tần suất (FR-040)
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: 'Mã máy đọc được, ví dụ EMAIL_TAKEN, EMAIL_PENDING_DELETION, VALIDATION_FAILED, ACCOUNT_DISABLED, ACCOUNT_PENDING_DELETION, ACCOUNT_DELETED, PLACEMENT_SET_INVALID, PATH_PAUSED, SESSION_INCOMPLETE, SESSION_COMPLETED, CONTENT_EXHAUSTED, CLASS_MANAGED, SEAT_UNAVAILABLE, SEAT_REASSIGN_LIMIT, SEAT_BELOW_USAGE, CLASS_NOT_READY, CLASS_FULL, CLASS_ARCHIVED, LAST_TEACHER, ALREADY_IN_CLASS, INVITEE_UNAVAILABLE' }
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
    Level: { type: string, enum: [none, N5, N4, N3, N2, N1] }
    ContentLevel: { type: string, enum: [N5, N4, N3] }
    TargetLevel: { type: string, enum: [N5, N4, N3, N2, N1], description: 'Mục tiêu JLPT; N2/N1 được chấp nhận nhưng nội dung Giai đoạn 1 chỉ đến N3 (`scopeNotice`)' }
    ScopeNotice: { type: string, enum: [content_ceiling_n3], nullable: true, description: 'Trình độ hoặc mục tiêu vượt phạm vi nội dung hiện có (N5–N3); lộ trình dùng N3 làm trần' }
    Skill: { type: string, enum: [vocabulary, grammar, kanji] }
    ReviewFacet:
      type: string
      enum: [item, meaning, reading, word]
      description: '`item` cho từ vựng/ngữ pháp và bài tập không gắn chữ; Kanji dùng meaning | reading | word (lịch ôn theo cặp chữ–khía cạnh)'
    KanjiDetails:
      type: object
      description: Thông tin chữ Kanji gửi cho người học (đã bản địa hóa)
      required: [onReadings, kunReadings, strokeCount]
      properties:
        onReadings: { type: array, items: { type: string }, description: 'Âm On (katakana); có thể rỗng' }
        kunReadings: { type: array, items: { type: string }, description: 'Âm Kun (hiragana, `.` phân cách okurigana); có thể rỗng. onReadings ∪ kunReadings không rỗng' }
        strokeCount: { type: integer, minimum: 1, maximum: 30 }
        components: { type: string, allOf: [{ $ref: '#/components/schemas/LocalizedText' }], nullable: true }
    KanjiDetailsWrite:
      type: object
      description: Thông tin chữ Kanji admin ghi (song ngữ)
      required: [onReadings, kunReadings, strokeCount]
      properties:
        onReadings: { type: array, items: { type: string } }
        kunReadings: { type: array, items: { type: string } }
        strokeCount: { type: integer, minimum: 1, maximum: 30 }
        components: { type: object, allOf: [{ $ref: '#/components/schemas/I18nText' }], nullable: true }
    Lang: { type: string, enum: [vi, en] }
    GoalType: { type: string, enum: [jlpt, daily_conversation, work] }
    AccountStatus: { type: string, enum: [active, disabled, pending_deletion] }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        language: { $ref: '#/components/schemas/Lang' }
        timezone: { type: string, example: Asia/Ho_Chi_Minh }
        fromTrial: { type: boolean, default: false, description: Đăng ký ngay sau khi dùng thử trên cùng trình duyệt (đo SC-011) }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Số giây hiệu lực của access token }
    Profile:
      type: object
      properties:
        displayName: { type: string }
        currentLevel: { $ref: '#/components/schemas/Level' }
        goalType: { $ref: '#/components/schemas/GoalType' }
        targetLevel: { $ref: '#/components/schemas/TargetLevel' }
        dailyMinutes: { type: integer, enum: [5, 10, 15, 30] }
        targetDate: { type: string, format: date, nullable: true }
        skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        prioritizedSkill: { type: string, allOf: [{ $ref: '#/components/schemas/Skill' }], nullable: true }
        language: { $ref: '#/components/schemas/Lang' }
        timezone: { type: string }
        paused: { type: boolean }
        onboardingState: { type: string, enum: [not_started, in_progress, completed] }
        soundEnabled: { type: boolean, default: true, description: 'Bật/tắt âm thanh phản hồi và chúc mừng (spec 005). Mặc định true.' }
        visualEffectsEnabled: { type: boolean, default: true, description: 'Bật/tắt hiệu ứng hình ảnh (hoạt ảnh, màn chúc mừng động). Khi tắt, kết quả đúng/sai và thành tựu vẫn được thể hiện bằng dạng tĩnh. Mặc định true.' }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [learner, admin] }
        status: { $ref: '#/components/schemas/AccountStatus' }
        profile: { $ref: '#/components/schemas/Profile' }
        learningSource: { type: string, enum: [personal, class], description: 'Nguồn học hiện tại (spec 004); `class` - lộ trình do lớp quyết định' }
        classSummary:
          type: object
          description: 'Chỉ có khi `learningSource = class`'
          required: [classId, className, organizationName, lockedFields]
          properties:
            classId: { type: string, format: uuid }
            className: { type: string }
            organizationName: { type: string }
            lockedFields: { type: array, items: { type: string }, description: 'Trường hồ sơ/điều khiển bị khóa - client hiển thị khóa kèm lý do (FR-018)' }
        organization:
          type: object
          description: 'Có khi tài khoản là chủ tổ chức hoặc giáo viên'
          required: [id, name, roles, dataAccess]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            roles: { type: array, items: { type: string, enum: [owner, teacher] } }
            dataAccess: { type: boolean, description: 'false nếu mất seat/hết hạn: chỉ xem cấu trúc' }
            license:
              type: object
              nullable: true
              description: 'Để giáo viên (không gọi được GET /org) cũng thấy cảnh báo hết hạn (FR-006); null khi tổ chức chưa có giấy phép'
              required: [state, endsOn, graceEndsOn]
              properties:
                state: { $ref: '#/components/schemas/LicenseState' }
                endsOn: { type: string, format: date }
                graceEndsOn: { type: string, format: date }
    ProfileUpdate:
      type: object
      description: Mọi trường tùy chọn; các thay đổi liên quan lộ trình/kế hoạch có hiệu lực ở kế hoạch tiếp theo (SC-006). Đổi `goalType`/`targetLevel`/`targetDate` sinh lại lộ trình (`reason='goal_change'`); đổi `currentLevel` sinh lại lộ trình (`reason='level_change'`); đổi `dailyMinutes`/`prioritizedSkill` không sinh lộ trình mới mà áp dụng trực tiếp cho kế hoạch kế tiếp. Đổi `email` bắt buộc kèm `currentPassword`.
      properties:
        displayName: { type: string }
        email: { type: string, format: email }
        currentPassword: { type: string, writeOnly: true, description: Bắt buộc khi có `email` }
        currentLevel: { $ref: '#/components/schemas/Level' }
        dailyMinutes: { type: integer, enum: [5, 10, 15, 30] }
        goalType: { $ref: '#/components/schemas/GoalType' }
        targetLevel: { $ref: '#/components/schemas/TargetLevel' }
        targetDate: { type: string, format: date, nullable: true }
        prioritizedSkill: { type: string, allOf: [{ $ref: '#/components/schemas/Skill' }], nullable: true }
        skills:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Skill' }
          description: 'Kỹ năng muốn cải thiện. Đổi giá trị KHÔNG sinh lộ trình mới; có hiệu lực ở kế hoạch sinh kế tiếp (kế hoạch đã sinh hôm nay không đổi). Tiến độ và lịch ôn giữ nguyên. Nếu `prioritizedSkill` hiện tại (hoặc gửi kèm) không thuộc `skills` mới thì được đặt null.'
        language: { $ref: '#/components/schemas/Lang' }
        timezone: { type: string }
        soundEnabled: { type: boolean, description: 'Chỉ hai trường hiệu ứng: không sinh lại lộ trình, không đụng kế hoạch, không cần `currentPassword`, học viên thuộc lớp vẫn sửa được (spec 005).' }
        visualEffectsEnabled: { type: boolean }
    LocalizedText:
      type: string
      description: Văn bản đã được bản địa hóa theo ngôn ngữ yêu cầu
    Exercise:
      type: object
      required: [id, type, prompt, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [multiple_choice, matching, fill_blank] }
        facet: { $ref: '#/components/schemas/ReviewFacet' }
        prompt: { $ref: '#/components/schemas/LocalizedText' }
        payload:
          type: object
          description: 'Dạng theo `type`: `multiple_choice` → `choices[]`; `matching` → `left[]` và `right[]` (vế phải đã xáo; trả lời là danh sách cặp [vế trái, vế phải]); `fill_blank` → `hint` (tùy chọn). KHÔNG chứa đáp án trong luồng người học.'
    ContentItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/Skill' }
        japanese: { type: string }
        reading: { type: string, nullable: true }
        meaning: { $ref: '#/components/schemas/LocalizedText' }
        explanation: { type: string, allOf: [{ $ref: '#/components/schemas/LocalizedText' }], nullable: true }
        topicId: { type: string, format: uuid, nullable: true, description: 'Chủ đề của chữ (chỉ Kanji)' }
        kanji:
          type: object
          allOf: [{ $ref: '#/components/schemas/KanjiDetails' }]
          nullable: true
          description: 'Chỉ có khi `kind=kanji`; `reading` khi đó là null'
        examples:
          type: array
          items:
            type: object
            properties:
              ja: { type: string }
              reading: { type: string, nullable: true }
              kanjiReading: { type: string, nullable: true, description: 'Kanji: cách đọc của chữ trong từ ví dụ này' }
              translation: { $ref: '#/components/schemas/LocalizedText' }
    TrialContent:
      type: object
      properties:
        units:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { $ref: '#/components/schemas/Skill' }
              title: { $ref: '#/components/schemas/LocalizedText' }
              estMinutes: { type: integer }
              items: { type: array, items: { $ref: '#/components/schemas/ContentItem' } }
              exercises:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Exercise'
                    - type: object
                      properties:
                        answerKey:
                          type: object
                          description: 'Đáp án để client chấm cục bộ (chỉ cho nội dung dùng thử công khai). Dạng theo `type`: `multiple_choice` → `correctIndex`; `matching` → `pairs` (danh sách cặp [vế trái, vế phải đúng] theo ngôn ngữ yêu cầu); `fill_blank` → `acceptedAnswers` (so khớp sau khi chuẩn hóa NFKC, bỏ khoảng trắng thừa, không phân biệt hoa thường).'
                          properties:
                            correctIndex: { type: integer }
                            pairs: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
                            acceptedAnswers: { type: array, items: { type: string } }
                        feedbackCorrect: { $ref: '#/components/schemas/LocalizedText' }
                        feedbackIncorrect: { $ref: '#/components/schemas/LocalizedText' }
    PlacementQuestionSet:
      type: object
      properties:
        timeLimitSeconds: { type: integer, example: 600 }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              skill: { $ref: '#/components/schemas/Skill' }
              prompt: { type: string }
              choices: { type: array, items: { type: string } }
    PlacementAnswers:
      type: object
      required: [answers]
      properties:
        classRequestId: { type: string, format: uuid, description: 'Spec 004: nộp bài cho yêu cầu kiểm tra trình độ của lớp; kết quả lưu `is_current=false`, không đổi lộ trình hay kết quả hiện hành' }
        durationSeconds: { type: integer }
        answers:
          type: array
          items:
            type: object
            required: [questionId, choice]
            properties:
              questionId: { type: string, format: uuid }
              choice: { type: integer, nullable: true, description: 'null = bỏ trống' }
    PlacementResult:
      type: object
      properties:
        id: { type: string, format: uuid, nullable: true, description: 'null cho khách (không lưu)' }
        estimatedLevel: { $ref: '#/components/schemas/Level' }
        score: { type: integer }
        total: { type: integer }
        strongTopics: { type: array, items: { type: string } }
        weakTopics: { type: array, items: { type: string } }
        guessSuspected: { type: boolean }
    OnboardingDraft:
      type: object
      properties:
        currentLevel: { $ref: '#/components/schemas/Level' }
        goalType: { $ref: '#/components/schemas/GoalType' }
        targetLevel: { $ref: '#/components/schemas/TargetLevel' }
        dailyMinutes: { type: integer, enum: [5, 10, 15, 30] }
        targetDate: { type: string, format: date, nullable: true }
        skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        placementResultId: { type: string, format: uuid, nullable: true }
        timezone: { type: string }
    OnboardingState:
      type: object
      properties:
        state: { type: string, enum: [not_started, in_progress, completed] }
        draft: { $ref: '#/components/schemas/OnboardingDraft' }
        carriedPlacement: { type: object, allOf: [{ $ref: '#/components/schemas/PlacementResult' }], nullable: true }
    PathSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        totalUnits: { type: integer }
        completedUnits: { type: integer }
        startLevel: { $ref: '#/components/schemas/Level' }
        reason: { type: string, enum: [onboarding, rebuild_request, goal_change, level_change, placement_retake] }
        scopeNotice: { $ref: '#/components/schemas/ScopeNotice' }
        message: { type: string, nullable: true, description: 'Ví dụ: kỹ năng chưa hỗ trợ trong phiên bản này' }
    PathDetail:
      allOf:
        - $ref: '#/components/schemas/PathSummary'
        - type: object
          properties:
            source: { type: string, enum: [personal, class], description: 'Spec 004: nguồn của lộ trình; `class` khi học viên thuộc lớp' }
            items:
              type: array
              description: Thứ tự đơn vị được tính động tại thời điểm gọi từ tham số lộ trình, nội dung `active` hiện hành và trạng thái học (không lưu sẵn; đơn vị mới kích hoạt xuất hiện ở lần gọi kế tiếp, SC-008)
              items:
                type: object
                properties:
                  unitId: { type: string, format: uuid }
                  title: { $ref: '#/components/schemas/LocalizedText' }
                  kind: { $ref: '#/components/schemas/Skill' }
                  level: { $ref: '#/components/schemas/ContentLevel' }
                  estMinutes: { type: integer }
                  status: { type: string, enum: [pending, in_progress, completed, mastered] }
    PlanItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [new_unit, review_batch] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        estMinutes: { type: integer, minimum: 1, maximum: 15, description: 'Ước lượng; review_batch = ceil(itemCount × REVIEW_SECONDS_PER_ITEM / 60)' }
        status: { type: string, enum: [pending, in_progress, completed] }
        itemCount: { type: integer, nullable: true }
        kind:
          type: string
          allOf: [{ $ref: '#/components/schemas/Skill' }]
          nullable: true
          description: 'Kỹ năng của đơn vị với `new_unit` (client hiển thị nhãn Kanji); null với `review_batch`'
    MasterResult:
      type: object
      required: [remainingUnits]
      properties:
        remainingUnits: { type: integer, description: 'Số đơn vị còn có thể học (chưa học hoặc đang học dở, chưa thành thạo) trong khoảng trình độ của lộ trình hiện tại' }
        suggestion:
          type: string
          nullable: true
          enum: [raise_level, content_exhausted]
          description: 'Chỉ có khi remainingUnits = 0. raise_level: còn nội dung ở trình độ cao hơn (≤ N3) – client mời nâng trình độ (PATCH /me currentLevel → level_change) hoặc làm lại placement; content_exhausted: đã ở trần N3 – dùng chung mã với thông báo hết nội dung'
    DailyPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        localDate: { type: string, format: date }
        budgetMinutes: { type: integer }
        estimatedMinutes: { type: integer, description: Luôn ≤ budgetMinutes }
        status: { type: string, enum: [open, completed] }
        items: { type: array, items: { $ref: '#/components/schemas/PlanItem' } }
        notice:
          type: string
          nullable: true
          description: 'Thông báo (đã học hết nội dung phù hợp, kế hoạch đã điều chỉnh sau khoảng nghỉ…)'
        kanjiNotice:
          type: object
          nullable: true
          description: 'Chỉ có khi người học đã chọn Kanji và đã học hết bài Kanji phù hợp trình độ (FR-013). Kế hoạch vẫn có bài của kỹ năng khác và ôn tập'
          required: [code, suggestion]
          properties:
            code: { type: string, enum: [kanji_exhausted] }
            suggestion: { type: string, enum: [raise_level, content_exhausted] }
        summary:
          type: object
          allOf: [{ $ref: '#/components/schemas/SessionSummary' }]
          nullable: true
    LessonSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [in_progress, completed] }
        kind: { type: string, enum: [new_unit, review, extra] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        items: { type: array, items: { $ref: '#/components/schemas/ContentItem' } }
        exercises: { type: array, items: { $ref: '#/components/schemas/Exercise' } }
        answered:
          type: array
          items:
            type: object
            properties:
              exerciseId: { type: string, format: uuid }
              isCorrect: { type: boolean }
    AnswerSubmission:
      type: object
      required: [clientEventId, exerciseId, answer]
      properties:
        clientEventId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        answer: { description: 'Chỉ số lựa chọn, danh sách cặp, hoặc chuỗi điền từ' }
        answeredAt: { type: string, format: date-time }
        isRetry: { type: boolean, default: false, description: 'Câu hỏi lại cuối phiên (R6): có phản hồi nhưng không cập nhật lịch ôn, thống kê mảng hay độ chính xác' }
    AnswerResult:
      type: object
      properties:
        isCorrect: { type: boolean }
        feedback: { $ref: '#/components/schemas/LocalizedText' }
        correctAnswer: { description: Đáp án đúng khi trả lời sai }
        nextReviewDate: { type: string, format: date, nullable: true }
        duplicate: { type: boolean, description: 'true nếu clientEventId đã được ghi, hoặc bài tập này đã có câu trả lời lượt chính trong phiên (FR-041); khi đó trả lại kết quả đã có' }
    SessionSummary:
      type: object
      properties:
        correct: { type: integer }
        total: { type: integer }
        minutesSpent: { type: number }
        dayCompleted: { type: boolean }
        attentionItems:
          type: array
          description: 'Chữ Kanji có ít nhất một câu lượt chính sai trong phiên (US1.4); vắng mặt với phiên không có Kanji'
          items:
            type: object
            required: [itemId, japanese]
            properties:
              itemId: { type: string, format: uuid }
              japanese: { type: string }
        celebrations:
          allOf: [{ $ref: '#/components/schemas/Celebrations' }]
          description: 'Có mặt khi và chỉ khi phản hồi này đến từ lần `complete` thực sự hoàn thành phiên VÀ có ít nhất một thứ để chúc mừng (`dayCompleted = true` hoặc `achievements` không rỗng). Vắng khi: không có gì để chúc mừng; gọi lại (idempotent) trên phiên đã hoàn thành. Nếu client không nhận được phản hồi (đóng tab, mất kết nối), thành tựu vẫn được ghi nhận nhưng KHÔNG được chúc mừng bù ở lần sau. `dayCompleted` ở mức `SessionSummary` giữ nguyên ngữ nghĩa cũ; chỉ `celebrations.dayCompleted` là tín hiệu "chúc mừng một lần" (spec 005).'
    AchievementKind:
      type: string
      enum: [first_lesson, streak, items_learned, goal_progress, perfect_lesson]
    AchievementEarned:
      type: object
      description: Một thành tựu vừa đạt ở lần ghi nhận này. Chỉ xuất hiện đúng một lần (không đọc lại được).
      required: [code, kind, name, description]
      properties:
        code:
          type: string
          example: streak_7
          description: 'Mã ổn định trong danh mục cố định (xem specs/005-reward-feedback-effects/contracts/achievement-catalog.md), ví dụ `streak_7`, `items_100`, `goal_50`, `first_lesson`, `perfect_lesson`.'
        kind: { $ref: '#/components/schemas/AchievementKind' }
        threshold:
          type: integer
          minimum: 1
          description: 'Ngưỡng của mốc (ngày, số mục hoặc phần trăm). Vắng với `first_lesson` và `perfect_lesson`.'
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
    Celebrations:
      type: object
      description: Những gì cần chúc mừng sau lần hoàn thành này. Màn chúc mừng gộp hiện `dayCompleted` trước, rồi `achievements` lần lượt theo thứ tự trong mảng.
      required: [dayCompleted, achievements]
      properties:
        dayCompleted:
          type: boolean
          description: 'true khi lần hoàn thành này vừa hoàn thành mục cuối của kế hoạch hôm nay VÀ chưa từng chúc mừng ngày đó (tối đa một lần mỗi ngày, kể cả học thêm).'
        achievements:
          type: array
          description: 'Sắp theo thứ tự trình bày: `first_lesson`, `perfect_lesson`, `streak`, `items_learned`, `goal_progress`; trong cùng loại theo ngưỡng tăng dần.'
          items: { $ref: '#/components/schemas/AchievementEarned' }
    ProgressSummary:
      type: object
      properties:
        isEmpty: { type: boolean, description: true khi chưa có lịch sử (trạng thái trống thân thiện) }
        totalMinutes: { type: number }
        lessonsCompleted: { type: integer }
        reviewAccuracy: { type: number, nullable: true, minimum: 0, maximum: 1 }
        currentStreakDays: { type: integer }
        goal:
          type: object
          properties:
            completionRatio: { type: number, minimum: 0, maximum: 1 }
            onTrack: { type: boolean, nullable: true }
            targetDate: { type: string, format: date, nullable: true }
            scopeNotice: { $ref: '#/components/schemas/ScopeNotice' }
        kanji:
          type: object
          nullable: true
          description: 'null khi người học không chọn Kanji và chưa có dữ liệu Kanji. Các trường tổng (totalMinutes, lessonsCompleted, reviewAccuracy, currentStreakDays) đã bao gồm Kanji'
          required: [charactersLearned, lessonsCompleted, minutes]
          properties:
            charactersLearned: { type: integer, description: 'Số chữ có ít nhất một khía cạnh đã lên lịch ôn' }
            lessonsCompleted: { type: integer }
            minutes: { type: number, description: 'Thời gian học Kanji (phút); phiên ôn hỗn hợp được phân bổ theo tỷ lệ câu trả lời Kanji' }
            reviewAccuracy: { type: number, nullable: true, minimum: 0, maximum: 1 }
        weakTopics:
          type: array
          items:
            type: object
            properties:
              topicId: { type: string, format: uuid }
              skill: { $ref: '#/components/schemas/Skill' }
              name: { $ref: '#/components/schemas/LocalizedText' }
              accuracy: { type: number }
    I18nText:
      type: object
      required: [vi, en]
      properties:
        vi: { type: string }
        en: { type: string }
    AdminTopic:
      type: object
      required: [id, skill, level, name]
      properties:
        id: { type: string, format: uuid }
        skill: { $ref: '#/components/schemas/Skill' }
        level: { $ref: '#/components/schemas/ContentLevel' }
        name: { $ref: '#/components/schemas/I18nText' }
    AdminUnitWrite:
      type: object
      required: [kind, title, level, topicId, estMinutes, difficulty]
      properties:
        kind: { $ref: '#/components/schemas/Skill' }
        title: { $ref: '#/components/schemas/I18nText' }
        level: { $ref: '#/components/schemas/ContentLevel' }
        goalTags: { type: array, items: { $ref: '#/components/schemas/GoalType' } }
        topicId: { type: string, format: uuid }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        tier: { type: string, enum: [foundation, core], default: core, description: '`foundation` = nền tảng người mới, chỉ hợp lệ với level N5' }
        estMinutes: { type: integer, enum: [5, 10, 15] }
        sequence: { type: integer }
        items:
          type: array
          description: 'Khi sửa: phần tử có `id` được cập nhật, phần tử không có `id` được tạo mới; mục hiện có vắng mặt trong payload bị chuyển `inactive`, KHÔNG xóa cứng (giữ `study_records`/`review_schedules` – data-model §2.9).'
          items:
            type: object
            required: [japanese, meaning]
            properties:
              id: { type: string, format: uuid, description: Có khi sửa mục đã tồn tại }
              status: { type: string, enum: [active, inactive], default: active }
              japanese: { type: string }
              reading: { type: string, nullable: true }
              meaning: { $ref: '#/components/schemas/I18nText' }
              explanation: { type: object, allOf: [{ $ref: '#/components/schemas/I18nText' }], nullable: true }
              topicId: { type: string, format: uuid, nullable: true, description: 'Bắt buộc khi kind=kanji lúc kích hoạt (chủ đề skill=kanji); bỏ qua với kind khác. Lưu nháp không bắt buộc' }
              kanjiDetails:
                type: object
                allOf: [{ $ref: '#/components/schemas/KanjiDetailsWrite' }]
                nullable: true
                description: 'Bắt buộc đầy đủ khi kích hoạt kind=kanji (lưu nháp chấp nhận null); `reading` khi đó để null'
              examples: { type: array, items: { type: object }, description: '`[{ja, reading, translation: I18nText, kanjiReading?}]`' }
        exercises:
          type: array
          description: Cùng quy tắc với `items` – bài tập vắng mặt trong payload sửa bị chuyển `inactive`, không xóa cứng.
          items:
            type: object
            required: [type, prompt, payload, feedbackCorrect, feedbackIncorrect]
            properties:
              id: { type: string, format: uuid, description: Có khi sửa bài tập đã tồn tại }
              status: { type: string, enum: [active, inactive], default: active }
              itemIndex: { type: integer, minimum: 0, nullable: true, description: 'Chỉ số (từ 0) của mục trong `items` cùng payload mà bài tập kiểm tra; null/vắng = không gắn mục (không vào lịch ôn tập). Khi đọc, tính theo thứ tự `items` trả về' }
              facet:
                allOf: [{ $ref: '#/components/schemas/ReviewFacet' }]
                default: item
                description: 'Bài tập gắn chữ Kanji (`itemIndex` khác null trong đơn vị Kanji) PHẢI có meaning | reading | word; bài tập khác PHẢI là item'
              type: { type: string, enum: [multiple_choice, matching, fill_blank] }
              prompt: { $ref: '#/components/schemas/I18nText' }
              payload: { type: object, description: Gồm đáp án cố định (xem data-model.md §2.10) }
              feedbackCorrect: { $ref: '#/components/schemas/I18nText' }
              feedbackIncorrect: { $ref: '#/components/schemas/I18nText' }
    AdminUnit:
      allOf:
        - $ref: '#/components/schemas/AdminUnitWrite'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, active, inactive] }
            isTrial: { type: boolean }
            updatedAt: { type: string, format: date-time }
    AdminPlacementQuestion:
      type: object
      required: [level, skill, topicId, prompt, choices, correctChoice]
      properties:
        id: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/ContentLevel' }
