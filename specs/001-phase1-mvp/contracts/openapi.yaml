        topicId: { type: string, format: uuid }
        prompt: { type: string, description: Câu hỏi bằng tiếng Nhật }
        hint: { type: object, allOf: [{ $ref: '#/components/schemas/I18nText' }], nullable: true, description: Gợi ý song ngữ nối sau câu hỏi (tùy chọn) }
        choices: { type: array, minItems: 2, maxItems: 6, items: { type: string } }
        correctChoice: { type: integer, minimum: 0, description: Chỉ số đáp án đúng trong `choices` }
        position: { type: integer }
        isActive: { type: boolean, readOnly: true, description: Chỉ đổi qua PUT /admin/placement-questions/active-set }
    AdminUserPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              email: { type: string }
              displayName: { type: string }
              role: { type: string, enum: [learner, admin] }
              status: { $ref: '#/components/schemas/AccountStatus' }
              createdAt: { type: string, format: date-time }
        nextCursor: { type: string, nullable: true }
    AdminActionLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string, format: uuid, nullable: true }
        diff: { type: object, nullable: true, additionalProperties: true, description: 'Thay đổi trước/sau, đã loại thông tin nhạy cảm (mật khẩu, token, email)' }
        occurredAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- spec 004 (1.12.0): tổ chức, lớp học, lộ trình lớp
    OrgStatus: { type: string, enum: [active, disabled] }
    LicenseState: { type: string, enum: [ok, expiring, in_grace, lapsed], description: 'ok - còn hiệu lực; expiring - còn ≤ SEAT_EXPIRY_WARNING_DAYS đến hạn; in_grace - quá hạn nhưng trong ân hạn; lapsed - hết ân hạn/bị thu hồi' }
