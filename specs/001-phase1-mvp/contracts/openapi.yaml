        status: { type: string, enum: [active, archived] }
        memberCount: { type: integer }
        hasPath: { type: boolean }
        teachers: { type: array, items: { type: object, required: [userId, displayName], properties: { userId: { type: string, format: uuid }, displayName: { type: string } } } }
        needAttentionCount: { type: integer, description: 'Chỉ có khi người gọi có quyền xem dữ liệu học viên' }
        teacherless: { type: boolean }
    ClassDetail:
      allOf:
        - $ref: '#/components/schemas/ClassRow'
        - type: object
          properties:
            description: { type: string, nullable: true }
            absenceThresholdDays: { type: integer, minimum: 1, maximum: 14 }
            archivedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
    RosterRow:
      type: object
      required: [displayName, status, at]
      properties:
        userId: { type: string, format: uuid, nullable: true }
        displayName: { type: string }
        email: { type: string, nullable: true }
        status: { type: string, enum: [joined, invited, declined, switched_personal, removed, other_ended] }
        at: { type: string, format: date-time }
        invitationId: { type: string, format: uuid, nullable: true }
    ImportResults:
      type: object
      required: [summary, results]
      properties:
        summary: { type: object, additionalProperties: { type: integer }, description: 'Đếm theo `outcome`, kèm `total`' }
        results:
          type: array
          items:
            type: object
            required: [email, outcome]
            properties:
              row: { type: integer, minimum: 1 }
              email: { type: string }
              outcome: { type: string, enum: [invited, invalid_email, duplicate_in_file, already_in_class, already_in_other_class, already_invited, no_seat, unavailable] }
    JoinCode:
      type: object
      required: [enabled]
      properties:
        code: { type: string, nullable: true }
        enabled: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
    ClassPathTemplate:
      type: object
      required: [startLevel, targetLevel, skills, startsOn, endsOn, dailyMinutes]
      properties:
        startLevel: { $ref: '#/components/schemas/Level' }
        targetLevel: { $ref: '#/components/schemas/TargetLevel' }
        skills: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/Skill' } }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, description: '> startsOn' }
        dailyMinutes: { type: integer, enum: [5, 10, 15, 30] }
    ClassPath:
      allOf:
        - $ref: '#/components/schemas/ClassPathTemplate'
        - type: object
          required: [mode, units, assignments, warnings, contentNotices, updatedAt]
          properties:
            mode: { type: string, enum: [template, explicit] }
            scopeNotice: { $ref: '#/components/schemas/ScopeNotice' }
            units: { type: array, items: { $ref: '#/components/schemas/ClassPathUnit' }, description: 'explicit - đúng danh sách và thứ tự giáo viên chọn; template - thứ tự tham khảo tính động' }
            assignments: { type: array, items: { $ref: '#/components/schemas/ClassAssignment' } }
            warnings: { type: array, items: { $ref: '#/components/schemas/PathWarning' } }
            contentNotices: { type: array, items: { $ref: '#/components/schemas/ContentNotice' } }
            updatedAt: { type: string, format: date-time }
    ClassPathUnit:
      type: object
      required: [unitId, title, kind, level, estMinutes, position]
      properties:
        unitId: { type: string, format: uuid }
        title: { type: string }
        kind: { $ref: '#/components/schemas/Skill' }
        level: { type: string }
        estMinutes: { type: integer }
        position: { type: integer }
        opensOn: { type: string, format: date, nullable: true }
        isOpen: { type: boolean }
    PathWarning:
      type: object
      description: 'Cảnh báo khả thi (FR-025) - không chặn lưu'
      required: [code, requiredMinutes, capacityMinutes]
      properties:
        code: { type: string, enum: [over_capacity] }
        requiredMinutes: { type: integer }
        capacityMinutes: { type: integer }
        assignmentId: { type: string, format: uuid, nullable: true }
    ContentNotice:
      type: object
      description: 'Đơn vị đã bị vô hiệu hóa còn nằm trong lộ trình/bài giao (FR-020)'
      required: [unitId, title, source]
      properties:
        unitId: { type: string, format: uuid }
        title: { type: string }
        source: { type: string, enum: [path, assignment] }
    ClassAssignment:
      type: object
      required: [id, batchId, unitId, title, dueOn]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        title: { type: string }
        dueOn: { type: string, format: date }
    ClassPause:
      type: object
      required: [id, startedOn]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true, description: 'null - cả lớp' }
        displayName: { type: string, nullable: true }
        startedOn: { type: string, format: date }
        endedOn: { type: string, format: date, nullable: true }
    ClassProgressStatus: { type: string, enum: [on_track, behind, ahead, paused] }
    ClassAlert: { type: string, enum: [absent, behind, overdue_assignment] }
    LearnerOverride:
      type: object
      properties:
        dailyMinutes: { type: integer, enum: [5, 10, 15, 30], nullable: true }
        shiftDays: { type: integer, minimum: -60, maximum: 60 }
        exemptUnitIds: { type: array, items: { type: string, format: uuid } }
    ClassLearnerRow:
      type: object
      description: 'Danh sách trắng theo FR-035 - KHÔNG thêm trường ngoài danh sách này nếu chưa đổi spec'
      required: [userId, displayName, email, hasStarted, pathCompleted, progressStatus, alerts]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        joinedAt: { type: string, format: date-time }
        hasStarted: { type: boolean, description: 'false - giao diện hiện "chưa bắt đầu" thay vì số 0' }
        pathCompleted: { type: boolean }
        completionRatio: { type: number, minimum: 0, maximum: 1, nullable: true }
        expectedRatio: { type: number, minimum: 0, maximum: 1 }
        streakDays: { type: integer }
        minutesLast7Days: { type: number }
        minutesTotal: { type: number, description: từ khi vào lớp }
        reviewAccuracy: { type: number, nullable: true }
        lastActiveOn: { type: string, format: date, nullable: true }
        progressStatus: { $ref: '#/components/schemas/ClassProgressStatus' }
        alerts: { type: array, items: { $ref: '#/components/schemas/ClassAlert' } }
        absentDays: { type: integer }
        overrides: { $ref: '#/components/schemas/LearnerOverride' }
    ClassDashboard:
      type: object
      required: [classId, learners, summary, contentNotices]
      properties:
        classId: { type: string, format: uuid }
        learners: { type: array, items: { $ref: '#/components/schemas/ClassLearnerRow' } }
        summary:
          type: object
          required: [learnerCount, onTrack, behind, ahead, paused, needAttention]
          properties:
            learnerCount: { type: integer }
            onTrack: { type: integer }
            behind: { type: integer }
            ahead: { type: integer }
            paused: { type: integer }
            needAttention: { type: integer }
            avgCompletionRatio: { type: number, nullable: true }
            avgReviewAccuracy: { type: number, nullable: true }
        contentNotices: { type: array, items: { $ref: '#/components/schemas/ContentNotice' } }
        teacherlessWarning: { type: boolean }
    ClassLearnerDetail:
      type: object
      required: [userId, displayName, row, units, dailyMinutes30, weakTopics, assignmentStates]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        row: { $ref: '#/components/schemas/ClassLearnerRow' }
        units: { type: array, items: { type: object, required: [unitId, title, status], properties: { unitId: { type: string, format: uuid }, title: { type: string }, status: { type: string, enum: [pending, in_progress, completed, mastered, exempt] }, dueOn: { type: string, format: date, nullable: true } } } }
        dailyMinutes30: { type: array, items: { type: object, required: [date, minutes], properties: { date: { type: string, format: date }, minutes: { type: number } } } }
        reviewAccuracy: { type: number, nullable: true }
        weakTopics: { type: array, items: { type: object, required: [topicId, name], properties: { topicId: { type: string }, name: { type: string }, accuracy: { type: number }, answers: { type: integer } } } }
        placement: { type: object, nullable: true, properties: { estimatedLevel: { $ref: '#/components/schemas/Level' }, score: { type: integer }, total: { type: integer }, takenAt: { type: string, format: date-time } } }
        assignmentStates: { type: array, items: { type: object, required: [assignmentId, state], properties: { assignmentId: { type: string, format: uuid }, state: { type: string, enum: [pending, on_time, late, overdue] } } } }
    ClassWeakTopic:
      type: object
      required: [topicId, name, skill, accuracy, answers, flaggedLearners]
      properties:
        topicId: { type: string }
        name: { type: string }
        skill: { $ref: '#/components/schemas/Skill' }
        accuracy: { type: number }
        answers: { type: integer }
        flaggedLearners: { type: array, items: { type: object, required: [userId, displayName], properties: { userId: { type: string, format: uuid }, displayName: { type: string } } } }
    ClassPlacementRequest:
      type: object
      required: [id, requestedAt]
      properties:
        id: { type: string, format: uuid }
        requestedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    ClassPlacementResults:
      type: object
      required: [request, results, distribution]
      properties:
        request: { $ref: '#/components/schemas/ClassPlacementRequest' }
        results: { type: array, items: { type: object, required: [userId, displayName, status], properties: { userId: { type: string, format: uuid }, displayName: { type: string }, status: { type: string, enum: [done, pending] }, estimatedLevel: { $ref: '#/components/schemas/Level' }, score: { type: integer }, total: { type: integer }, takenAt: { type: string, format: date-time } } } }
        distribution: { type: object, additionalProperties: { type: integer }, description: 'Số học viên theo `estimatedLevel` (none, N5, N4, N3)' }
    MyClass:
      type: object
      required: [class, path, assignments, disclosure, progress, joinedAt]
      properties:
        class: { $ref: '#/components/schemas/ClassBrief' }
        joinedAt: { type: string, format: date-time }
        path: { $ref: '#/components/schemas/ClassPathTemplate' }
        assignments:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ClassAssignment'
              - type: object
                required: [state]
                properties: { state: { type: string, enum: [pending, on_time, late, overdue] } }
        teacherAdjustments: { $ref: '#/components/schemas/LearnerOverride' }
        pausedToday: { type: boolean }
        movedNotice: { type: object, nullable: true, description: 'Không còn dùng (luôn null): chuyển lớp cần học viên đồng ý lại nên không có thông báo "bị chuyển"', properties: { fromClassName: { type: string }, at: { type: string, format: date-time } } }
        disclosure: { $ref: '#/components/schemas/SharedDataDisclosure' }
        progress:
          type: object
          description: 'CÙNG nguồn repository với bảng điều khiển, cùng cửa sổ từ joinedAt (research O11)'
          required: [hasStarted, minutesTotal, minutesLast7Days, streakDays]
          properties:
            hasStarted: { type: boolean }
            completionRatio: { type: number, nullable: true }
            minutesTotal: { type: number }
            minutesLast7Days: { type: number }
            reviewAccuracy: { type: number, nullable: true }
            streakDays: { type: integer }
            lastActiveOn: { type: string, format: date, nullable: true }
        placementRequest: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, requestedAt: { type: string, format: date-time } } }

security:
  - bearerAuth: []
