<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- $FLUTTER_BASE_HREF được công cụ build của Flutter thay thế (flutter build web --base-href). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Học tiếng Nhật cá nhân hóa, mỗi ngày 5–15 phút.">

  <!--
    CSP chặt chẽ (FR-034, R16): token lưu ở trình duyệt nên phải chặn XSS. Mọi tài nguyên cùng nguồn;
    API đi qua proxy `/api` cùng origin. Cần build với `--no-web-resources-cdn` để CanvasKit và phông
    được phục vụ từ chính origin (không tải từ gstatic). `'wasm-unsafe-eval'` cần cho WebAssembly của
    Flutter; `style-src 'unsafe-inline'` vì Flutter chèn thẻ style khi khởi động.
    `frame-ancestors` không đặt được qua thẻ meta nên nằm ở header của nginx (client/nginx.conf).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">

  <title>Học tiếng Nhật</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
