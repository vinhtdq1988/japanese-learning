<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- $FLUTTER_BASE_HREF được công cụ build của Flutter thay thế (flutter build web --base-href). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Học tiếng Nhật cá nhân hóa, mỗi ngày 5–15 phút.">

  <!--
    Trang này KHÔNG khai báo CSP (không có thẻ meta Content-Security-Policy). Mẫu này dùng chung cho
    `flutter run` (local) và `flutter build web` (release): dev server chèn script nội tuyến (hot reload,
    debug) không thể băm hay gắn nonce, và trình duyệt áp dụng GIAO của mọi chính sách nên một meta chặt
    sẽ làm trang trắng ở local.
    CSP của triển khai thật là header trong client/nginx.conf (nguồn DUY NHẤT, kèm `frame-ancestors 'none'`).
    Bản release phải build với `--no-web-resources-cdn` để CanvasKit và phông phục vụ từ chính origin.
    KHÔNG thêm lại thẻ meta CSP ở đây: backend/tests/unit/web-csp.test.ts sẽ báo lỗi.
  -->
  <meta name="referrer" content="no-referrer">

  <title>Học tiếng Nhật</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
