# nginx phục vụ client web tĩnh, proxy API cùng origin và chấm dứt TLS (T118, R16, R18).
# Đặt tại /etc/nginx/conf.d/default.conf. Dịch vụ API tên `api` lắng nghe cổng 3000 (docker-compose.yml).
#
# Lưu ý: KHÔNG dùng `add_header` trong khối `location` – nginx sẽ bỏ các header khai báo ở mức `server`.
# Cache dùng `expires` (không ảnh hưởng các header bảo mật).

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    root  /usr/share/nginx/html;
    index index.html;

    # Header bảo mật (FR-034, R16). CSP khớp thẻ meta trong client/web/index.html, thêm frame-ancestors
    # (không đặt được qua meta). Tests: backend/tests/unit/web-csp.test.ts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm font/ttf font/otf;

    # API cùng origin: client gọi `/api/v1/...`; nginx chuyển nguyên đường dẫn tới dịch vụ `api`.
    # Backend bật trustProxy ở production nên giới hạn tần suất theo IP đọc X-Forwarded-For.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # Tệp có băm tên (assets, canvaskit) có thể lưu đệm lâu; điểm vào và service worker luôn kiểm tra lại.
    location ~* \.(?:js|css|wasm|png|jpg|svg|ico|woff2?|ttf|otf)$ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html                 { expires -1; }
    location = /flutter_service_worker.js  { expires -1; }
    location = /flutter_bootstrap.js       { expires -1; }
    location = /version.json               { expires -1; }

    # Định tuyến phía client (go_router): đường dẫn không phải tệp trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
