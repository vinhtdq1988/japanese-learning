name: japanese_learning_client
description: Ứng dụng web học tiếng Nhật cá nhân hóa (Flutter, web desktop trước) – Giai đoạn 1 MVP.
publish_to: "none"
version: 0.1.0+1

environment:
  # >=3.8.0 phải khớp cận dưới SDK của gói API client sinh tự động (lib/data/api/generated, nằm trong lib/
  # của gói này): hai gói khác language version thì trình biên dịch báo lỗi ở các file `part`.
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  intl: any
  # Truy cập API trình duyệt (localStorage, mở liên kết) qua lớp platform/web
  web: ^1.0.0
  # API client sinh từ contracts/openapi.yaml (xem lib/data/api/README.md)
  japanese_api:
    path: lib/data/api/generated

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Chạy `dart run build_runner build` để sinh mã json_serializable cho API client
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  # Bật sinh mã l10n từ các file ARB trong lib/l10n (xem l10n.yaml)
  generate: true
